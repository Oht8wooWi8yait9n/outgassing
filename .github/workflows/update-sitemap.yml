name: Update NASA GSFC Outgassing Database & Sitemap

on:
  schedule:
    # Run weekly on Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  harvest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Harvest NASA GSFC Outgassing Database and generate static mirror
        run: |
          python3 generate_outgassing_sitemap.py

      - name: Commit and push changes (Zero-Churn Check)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff -I '<lastmod>' -I '"generated_at":' --quiet; then
            git add -A
            git commit -m "chore(outgassing): automated NASA GSFC Outgassing Database mirror update [skip ci]"
            git push
          else
            echo "No material record changes detected (zero-churn verified)."
          fi
